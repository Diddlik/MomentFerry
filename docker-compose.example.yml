services:
  momentferry:
    image: ${MOMENTFERRY_IMAGE:-ghcr.io/diddlik/momentferry:latest}
    container_name: momentferry
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Berlin

      # Initial defaults. After settings are saved in the Web UI,
      # ./data/runtime-settings.json takes precedence for these runtime values.
      MomentFerry__DryRun: "true"
      MomentFerry__Automation__Enabled: "true"
      MomentFerry__ReconciliationIntervalSeconds: "1800"
      MomentFerry__Automation__MaxFilesPerSharePerCycle: "200"
      MomentFerry__Automation__AllowFilesystemTimestampFallback: "false"
      MomentFerry__MinimumFreeSpaceReserveBytes: "536870912"

      # Optional access protection. Put the values in .env, then enable it in
      # Automation & safety. Secrets are never stored in runtime-settings.json.
      MomentFerry__Authentication__Username: ${MOMENTFERRY_USERNAME:-}
      MomentFerry__Authentication__Password: ${MOMENTFERRY_PASSWORD:-}

      # Optional MQTT integration. Disabled by default.
      MomentFerry__Mqtt__Enabled: "false"
      MomentFerry__Mqtt__Host: "192.168.1.10"
      MomentFerry__Mqtt__Port: "1883"
      MomentFerry__Mqtt__ClientId: "momentferry"
      MomentFerry__Mqtt__BaseTopic: "momentferry"
      MomentFerry__Mqtt__UseTls: "false"
      MomentFerry__Mqtt__ReconnectSeconds: "5"
      # MomentFerry__Mqtt__Username: "momentferry"
      # MomentFerry__Mqtt__Password: "change-me"

    volumes:
      # SQLite database and persistent runtime settings.
      - ./data:/app/data

      # Example source shares. The sync software is irrelevant to MomentFerry.
      - /volume1/photos/pavel:/sources/pavel
      - /volume1/photos/elena:/sources/elena
      - /volume1/photos/elisabeth:/sources/elisabeth

      # Common share synchronized back to all participating devices.
      - /volume1/photos/family:/destinations/family

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=momentferry"

  # Optional update companion. Set the same strong token in both services:
  # MomentFerry__Updates__WatchtowerUrl=http://momentferry-updater:8080
  # MomentFerry__Updates__WatchtowerToken=<token>
  # momentferry-updater:
  #   image: containrrr/watchtower:1.7.1
  #   container_name: momentferry-updater
  #   restart: unless-stopped
  #   command: --http-api-update --label-enable --scope momentferry
  #   environment:
  #     WATCHTOWER_HTTP_API_TOKEN: <same-token>
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   labels:
  #     - "com.centurylinklabs.watchtower.enable=false"
